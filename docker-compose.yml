services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres        # admin only; the app connects as the 'paysleuth' role
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/initdb.sql:/docker-entrypoint-initdb.d/initdb.sql:ro
      - paysleuth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      retries: 20

volumes:
  paysleuth-data:
